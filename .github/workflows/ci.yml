# Run tests, and on a push to main create a GitHub PRERELEASE carrying the npm package tarball.
# Nothing reaches npm from here: when you "Set as latest release" (uncheck prerelease) on GitHub,
# npm-release.yml publishes that release's tarball.
#
# Version bumps use tishlang/sem — Conventional Commits drive semver
# (feat/fix/perf/BREAKING release; chore/docs/ci/test do not).

name: CI (test, prerelease)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: End to end (scaffold, build for node and Vercel, serve, check)
        run: npm run test:e2e

  # ── Would this land a release? Runs on PRs so a bad commit type is caught before merge. ───────
  release_check:
    name: Release check (sem dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Dry-run sem
        id: sem
        uses: tishlang/sem@v1
        with:
          dry_run: true
          config: |
            branches: [main]
            plugins:
              - "@sem/commit-analyzer"
              - "@sem/release-notes-generator"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report bump
        run: |
          if [ "${{ steps.sem.outputs.new_release_published }}" = "true" ]; then
            echo "::notice::Would prerelease ${{ steps.sem.outputs.new_release_version }} from these commits."
          elif [ "${{ steps.sem.outputs.skipped }}" = "true" ]; then
            echo "::notice::Soft-skipped (${{ steps.sem.outputs.skip_reason }})."
          else
            echo "::notice::No version bump. Conventional Commits drive semver — feat/fix/perf/BREAKING release, chore/docs/ci do not."
          fi

  prerelease:
    name: Prerelease
    needs: [test, release_check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # sem creates the tag and the GitHub prerelease
      issues: write     # @sem/github opens a failure issue when a release throws
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - run: npm ci --no-audit --no-fund

      # actions/checkout configures no identity, and sem cannot create the tag without one.
      - name: Configure git identity for the release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Next version via sem (dry-run)
        id: sem
        uses: tishlang/sem@v1
        with:
          dry_run: true
          config: |
            branches: [main]
            plugins:
              - "@sem/commit-analyzer"
              - "@sem/release-notes-generator"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip when no bump
        id: gate
        run: |
          if [ "${{ steps.sem.outputs.new_release_published }}" != "true" ]; then
            echo "::notice::No version bump — skipping prerelease."
            echo "continue=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "continue=true" >> "$GITHUB_OUTPUT"
          echo "version=${{ steps.sem.outputs.new_release_version }}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${{ steps.sem.outputs.new_release_version }}"

      - name: Stamp the version and pack @tishlang/orbit
        if: steps.gate.outputs.continue == 'true'
        run: |
          npm version "${{ steps.gate.outputs.version }}" --no-git-tag-version --allow-same-version
          npm pack
          mv tishlang-orbit-*.tgz tishlang-orbit-npm-package.tgz

      # Promoting this prerelease to a full release is what fires npm-release.yml — there is a human
      # between "CI is green" and "this is on npm as latest".
      - name: Create the prerelease via @sem/github
        if: steps.gate.outputs.continue == 'true'
        uses: tishlang/sem@v1
        with:
          force: ${{ steps.gate.outputs.version }}
          config: |
            branches: [main]
            plugins:
              - "@sem/commit-analyzer"
              - "@sem/release-notes-generator"
              - - "@sem/npm"
                - npmPublish: false
              - - "@sem/github"
                - prerelease: true
                  successComment: false
                  assets:
                    - path: tishlang-orbit-npm-package.tgz
                      name: tishlang-orbit-npm-package.tgz
                      label: npm package (@tishlang/orbit)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
